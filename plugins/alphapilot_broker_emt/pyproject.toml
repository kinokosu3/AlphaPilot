[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphapilot-broker-emt"
version = "0.1.0"
description = "EMT live trade and quote plugin for AlphaPilot"
requires-python = ">=3.10"
dependencies = [
  "alphapilot>=0.1.dev0,<0.2",
  "alphapilot-broker-xcommon>=0.1,<0.2",
  "alphapilot_emt>=2.27,<2.28",
]

[project.entry-points."alphapilot.live.plugins"]
emt = "alphapilot_broker_emt.plugin:get_plugin_spec"

[tool.setuptools.packages.find]
where = ["."]
include = ["alphapilot_broker_emt*"]
