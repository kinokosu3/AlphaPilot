[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphapilot-broker-xcommon"
version = "0.1.0"
description = "Shared pure-Python support for AlphaPilot XTP-family broker plugins"
requires-python = ">=3.10"
dependencies = ["alphapilot>=0.1.dev0,<0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alphapilot_broker_xcommon*"]
